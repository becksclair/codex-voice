name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: saga-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
          "$HOME/.bun/bin/bun" --version
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libasound2-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config wget
      - run: cargo fmt --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cd web && bun install --frozen-lockfile && bun run check && bun run test && bun run build

  deny:
    runs-on: saga-build
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  web-e2e:
    runs-on: saga-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
          "$HOME/.bun/bin/bun" --version
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install desktop and browser build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libasound2-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config wget
      - run: cd web && bun install --frozen-lockfile && bun run build
      - run: cd webtests && bun install --frozen-lockfile && bunx playwright install --with-deps chromium
      - run: cargo build -q -p codex-voice-app --bin codex-voice
      - run: cd webtests && bunx playwright test

  publish:
    needs: [verify, deny, web-e2e]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    runs-on: saga-build
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SERVICE_ID: codex-voice
      SOURCE_COMMIT: ${{ gitea.sha }}
      PACKAGE_OWNER: ${{ gitea.repository_owner }}
      GITEA_SERVER_URL: ${{ gitea.server_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
          "$HOME/.bun/bin/bun" --version
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libasound2-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config wget
      - name: Build and validate immutable runtime artifact
        run: scripts/package_linux_amd64.sh "$SOURCE_COMMIT"
      - name: Publish once and read back exact Gitea package files
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PACKAGE_TOKEN" || { echo "PACKAGE_TOKEN secret is required" >&2; exit 1; }
          archive="${SERVICE_ID}-linux-amd64-${SOURCE_COMMIT}.tar.gz"
          package_url="${GITEA_SERVER_URL}/api/packages/${PACKAGE_OWNER}/generic/${SERVICE_ID}/${SOURCE_COMMIT}"
          readback=$(mktemp -d "${TMPDIR:-/tmp}/codex-voice-readback.XXXXXX")
          trap 'rm -rf -- "$readback"' EXIT

          for file in "$archive" "${archive}.sha256"; do
            local_file="output/releases/${file}"
            remote_file="$readback/${file}"
            status=$(curl \
              --silent \
              --show-error \
              --output "$remote_file" \
              --write-out '%{http_code}' \
              --header "Authorization: token ${PACKAGE_TOKEN}" \
              "${package_url}/${file}" || true)
            case "$status" in
              200)
                cmp --silent "$local_file" "$remote_file" || {
                  echo "immutable package file already exists with different bytes: $file" >&2
                  exit 1
                }
                ;;
              404)
                if ! curl \
                    --fail \
                    --silent \
                    --show-error \
                    --header "Authorization: token ${PACKAGE_TOKEN}" \
                    --upload-file "$local_file" \
                    "${package_url}/${file}"; then
                  echo "package upload did not return success; checking immutable read-back: $file" >&2
                fi
                ;;
              *)
                echo "package preflight failed for $file with HTTP $status" >&2
                exit 1
                ;;
            esac

            curl \
              --fail \
              --silent \
              --show-error \
              --output "$remote_file" \
              --header "Authorization: token ${PACKAGE_TOKEN}" \
              "${package_url}/${file}"
            cmp --silent "$local_file" "$remote_file" || {
              echo "published package read-back differs from local file: $file" >&2
              exit 1
            }
          done

          (cd "$readback" && sha256sum --check "${archive}.sha256")

  deploy-saga-backend:
    needs: publish
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    runs-on: asgard-build-1
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ gitea.sha }}
      PACKAGE_OWNER: ${{ gitea.repository_owner }}
      GITEA_SERVER_URL: ${{ gitea.server_url }}
      GITEA_REPOSITORY: ${{ github.repository }}
      GITEA_RUN_ID: ${{ github.run_id }}
      CENTRAL_HOMELAB_REPOSITORY: /home/bex/personal/homelab
      SAGA_HOMELAB_REPOSITORY: /home/bex/personal/saga-homelab
      CODEX_VOICE_CONFIG_SOURCE: /home/bex/.config/codex-voice/config.json
      CODEX_VOICE_PROVIDER_ENV_SOURCE: /home/bex/.config/codex-voice/saga-provider.env
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Deploy and accept the exact Saga backend artifact
        run: |
          set -euo pipefail
          stage_file="$RUNNER_TEMP/codex-voice-saga-deploy-stage"
          archive_sha_file="$RUNNER_TEMP/codex-voice-saga-archive-sha256"
          lock_file="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/codex-voice-saga-deploy.lock"
          install -m 0600 /dev/null "$stage_file"
          printf 'workflow-setup\n' > "$stage_file"
          install -m 0600 /dev/null "$archive_sha_file"
          flock --exclusive --wait 2700 "$lock_file" \
            python3 scripts/deploy_saga_backend.py \
              --source-commit "$SOURCE_COMMIT" \
              --gitea-server-url "$GITEA_SERVER_URL" \
              --package-owner "$PACKAGE_OWNER" \
              --stage-file "$stage_file" \
              --archive-sha-file "$archive_sha_file" \
              --producer-root "$GITHUB_WORKSPACE" \
              --central-repository "$CENTRAL_HOMELAB_REPOSITORY" \
              --saga-repository "$SAGA_HOMELAB_REPOSITORY" \
              --config-source "$CODEX_VOICE_CONFIG_SOURCE" \
              --provider-env-source "$CODEX_VOICE_PROVIDER_ENV_SOURCE" \
              --ssh-target saga
      - name: Email Bex after a terminal deployment failure
        if: failure()
        env:
          CODEX_VOICE_FAILURE_EMAIL_FROM: ${{ secrets.CODEX_VOICE_FAILURE_EMAIL_FROM }}
          CODEX_VOICE_FAILURE_EMAIL_TO: ${{ secrets.CODEX_VOICE_FAILURE_EMAIL_TO }}
          CODEX_VOICE_FAILURE_SMTP_HOST: ${{ secrets.CODEX_VOICE_FAILURE_SMTP_HOST }}
          CODEX_VOICE_FAILURE_SMTP_PORT: ${{ secrets.CODEX_VOICE_FAILURE_SMTP_PORT }}
          CODEX_VOICE_FAILURE_SMTP_SECURITY: ${{ secrets.CODEX_VOICE_FAILURE_SMTP_SECURITY }}
          CODEX_VOICE_FAILURE_SMTP_USERNAME: ${{ secrets.CODEX_VOICE_FAILURE_SMTP_USERNAME }}
          CODEX_VOICE_FAILURE_SMTP_PASSWORD: ${{ secrets.CODEX_VOICE_FAILURE_SMTP_PASSWORD }}
        run: |
          set -u
          stage_file="$RUNNER_TEMP/codex-voice-saga-deploy-stage"
          archive_sha_file="$RUNNER_TEMP/codex-voice-saga-archive-sha256"
          archive_sha256=""
          if [[ -r "$archive_sha_file" ]]; then
            candidate=$(tr -d '\r\n' < "$archive_sha_file")
            if [[ "$candidate" =~ ^[0-9a-f]{64}$ ]]; then
              archive_sha256="$candidate"
            fi
          fi
          python3 scripts/notify_saga_deploy_failure.py \
            --source-commit "$SOURCE_COMMIT" \
            --archive-sha256 "$archive_sha256" \
            --stage-file "$stage_file" \
            --diagnostic-pointer "${GITEA_SERVER_URL}/${GITEA_REPOSITORY}/actions/runs/${GITEA_RUN_ID}"
