name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: saga-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
          "$HOME/.bun/bin/bun" --version
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libasound2-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config wget
      - run: cargo fmt --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cd web && bun install --frozen-lockfile && bun run check && bun run test && bun run build

  deny:
    runs-on: saga-build
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  web-e2e:
    runs-on: saga-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
          "$HOME/.bun/bin/bun" --version
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install desktop and browser build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libasound2-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config wget
      - run: cd web && bun install --frozen-lockfile && bun run build
      - run: cd webtests && bun install --frozen-lockfile && bunx playwright install --with-deps chromium
      - run: cargo build -q -p codex-voice-app --bin codex-voice
      - run: cd webtests && bunx playwright test

  publish:
    needs: [verify, deny, web-e2e]
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    runs-on: saga-build
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.publish.outputs.archive_sha256 }}
    env:
      SERVICE_ID: codex-voice
      SOURCE_COMMIT: ${{ gitea.sha }}
      PACKAGE_OWNER: ${{ gitea.repository_owner }}
      GITEA_SERVER_URL: ${{ gitea.server_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
          "$HOME/.bun/bin/bun" --version
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libasound2-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config wget
      - name: Build and validate immutable runtime artifact
        run: scripts/package_linux_amd64.sh "$SOURCE_COMMIT"
      - name: Publish once and read back exact Gitea package files
        id: publish
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PACKAGE_TOKEN" || { echo "PACKAGE_TOKEN secret is required" >&2; exit 1; }
          archive="${SERVICE_ID}-linux-amd64-${SOURCE_COMMIT}.tar.gz"
          package_url="${GITEA_SERVER_URL}/api/packages/${PACKAGE_OWNER}/generic/${SERVICE_ID}/${SOURCE_COMMIT}"
          readback=$(mktemp -d "${TMPDIR:-/tmp}/codex-voice-readback.XXXXXX")
          trap 'rm -rf -- "$readback"' EXIT

          for file in "$archive" "${archive}.sha256"; do
            local_file="output/releases/${file}"
            remote_file="$readback/${file}"
            status=$(curl \
              --silent \
              --show-error \
              --output "$remote_file" \
              --write-out '%{http_code}' \
              --header "Authorization: token ${PACKAGE_TOKEN}" \
              "${package_url}/${file}" || true)
            case "$status" in
              200)
                cmp --silent "$local_file" "$remote_file" || {
                  echo "immutable package file already exists with different bytes: $file" >&2
                  exit 1
                }
                ;;
              404)
                if ! curl \
                    --fail \
                    --silent \
                    --show-error \
                    --header "Authorization: token ${PACKAGE_TOKEN}" \
                    --upload-file "$local_file" \
                    "${package_url}/${file}"; then
                  echo "package upload did not return success; checking immutable read-back: $file" >&2
                fi
                ;;
              *)
                echo "package preflight failed for $file with HTTP $status" >&2
                exit 1
                ;;
            esac

            curl \
              --fail \
              --silent \
              --show-error \
              --output "$remote_file" \
              --header "Authorization: token ${PACKAGE_TOKEN}" \
              "${package_url}/${file}"
            cmp --silent "$local_file" "$remote_file" || {
              echo "published package read-back differs from local file: $file" >&2
              exit 1
            }
          done

          (cd "$readback" && sha256sum --check "${archive}.sha256")
          printf 'archive_sha256=%s\n' "$(sha256sum "output/releases/${archive}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  deploy-saga-backend:
    needs: publish
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    runs-on: saga-deploy
    timeout-minutes: 20
    permissions:
      contents: none
    env:
      SOURCE_COMMIT: ${{ gitea.sha }}
      ARCHIVE_SHA256: ${{ needs.publish.outputs.archive_sha256 }}
      DEPLOY_HOST: saga.stegosaurus-aeolian.ts.net
    steps:
      - name: Submit registered deployment and wait for result
        env:
          SAGA_DEPLOY_SSH_KEY: ${{ secrets.SAGA_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -n "$SAGA_DEPLOY_SSH_KEY" || { echo 'SAGA_DEPLOY_SSH_KEY secret is required' >&2; exit 1; }

          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SAGA_DEPLOY_SSH_KEY" > "$ssh_dir/key"
          chmod 0600 "$ssh_dir/key"
          printf '%s %s %s\n' "$DEPLOY_HOST" 'ssh-ed25519' \
            'AAAAC3NzaC1lZDI1NTE5AAAAIN4/VeniWdaH34IwmOQB/+GhH8jbZ/5FTjtTRV/A+XGu' > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/known_hosts"

          ssh_args=(
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=10
            -i "$ssh_dir/key" "homelab-deploy@${DEPLOY_HOST}"
          )
          submit=$(ssh "${ssh_args[@]}" "submit ${SOURCE_COMMIT} sha256:${ARCHIVE_SHA256}")
          job_id=$(printf '%s\n' "$submit" | sed -n 's/.*"job_id":"\([a-z0-9._-]*\)".*/\1/p')
          [[ "$job_id" =~ ^codex-voice-[0-9a-f]{12}-[0-9a-f]{8}$ ]] || { echo 'deployment controller returned an invalid job id' >&2; exit 1; }
          printf 'deployment job: %s\n' "$job_id"

          for attempt in $(seq 1 180); do
            status=$(ssh "${ssh_args[@]}" "status ${job_id}")
            state=$(printf '%s\n' "$status" | sed -n 's/.*"state":"\([a-z]*\)".*/\1/p')
            case "$state" in
              succeeded) printf '%s\n' "$status"; exit 0 ;;
              failed) printf '%s\n' "$status" >&2; exit 1 ;;
              queued|running) sleep 5 ;;
              *) echo 'deployment controller returned an invalid state' >&2; exit 1 ;;
            esac
          done
          echo 'deployment did not finish within fifteen minutes' >&2
          exit 1
